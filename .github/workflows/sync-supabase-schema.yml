name: Sync Supabase Schema

# Run daily at 2 AM UTC or manually via workflow_dispatch
on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:     # Allow manual trigger

permissions:
  contents: write  # Required to commit and push changes

jobs:
  sync-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Install native PostgreSQL client
        run: |
          . /etc/os-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Verify Supabase CLI installation
        run: supabase --version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Dump Supabase schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Dumping schema from Supabase..."
          export PGHOST=aws-1-eu-central-1.pooler.supabase.com PGPORT=5432 PGDATABASE=postgres PGSSLMODE=require
          export PGUSER="postgres.$SUPABASE_PROJECT_ID" PGPASSWORD="$SUPABASE_DB_PASSWORD"
          # Generate the pinned CLI's schema filters, then run them with native pg_dump.
          # A dummy URL keeps credentials out of generated shell code. Remove its
          # connection exports so the real connection is supplied only through env.
          supabase db dump --agent=no --dry-run \
            --db-url postgresql://postgres:placeholder@127.0.0.1:54321/postgres \
            > "$RUNNER_TEMP/schema-dump-template.sh"
          sed '/^export PG[A-Z_]*=/d' "$RUNNER_TEMP/schema-dump-template.sh" > "$RUNNER_TEMP/schema-dump.sh"
          bash "$RUNNER_TEMP/schema-dump.sh" > supabase/schema/schema.sql

          echo "Schema dumped successfully"

      - name: Generate TypeScript types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "Generating TypeScript types..."

          # Generate types using Supabase CLI
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            > lib/supabase/database.ts

          echo "Types generated successfully"

      - name: Check for schema changes
        id: check_changes
        run: |
          # Check if there are any changes to the schema or types
          git add supabase/schema/schema.sql lib/supabase/database.ts

          if git diff --staged --quiet; then
            echo "No schema changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Schema changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push schema changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Create a commit with the schema changes
          git commit -m "chore: sync Supabase schema [automated]

          - Updated schema.sql with latest database structure
          - Regenerated TypeScript types from schema

          This commit was automatically generated by the sync-supabase-schema workflow."

          # Push changes
          git push origin "$GITHUB_REF_NAME"

          echo "✅ Schema changes committed and pushed"

      - name: No changes summary
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "✅ Schema is up-to-date, no changes needed"

      - name: Workflow summary
        if: always()
        env:
          SYNC_STATUS: ${{ job.status }}
        run: |
          echo "## Supabase Schema Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SYNC_STATUS" != "success" ]; then
            echo "Schema sync failed. Inspect the failed step; generated files may not be current." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ **Schema changes detected and committed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following files were updated:" >> $GITHUB_STEP_SUMMARY
            echo "- \`supabase/schema/schema.sql\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`lib/supabase/database.ts\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No schema changes detected**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The database schema is up-to-date with the repository." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow triggered:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
