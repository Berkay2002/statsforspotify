name: Compact ranking storage release
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, pause, migrate, verify, resume, rollback]
        default: inspect
        required: true
      expected_sha:
        description: Exact reviewed main commit
        required: true
      backup_run_id:
        description: Successful encrypted backup restored and verified locally
        required: false
      pause_run_id:
        description: Successful pause run recording the collector's original state
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: production-database-maintenance
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPERATION: ${{ inputs.operation }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      PAUSE_RUN_ID: ${{ inputs.pause_run_id }}
      GH_TOKEN: ${{ github.token }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGHOST: aws-1-eu-central-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify target and reviewed commit
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$SUPABASE_PROJECT_ID" = zpswcygleazebxmpblcx
          echo "PGUSER=postgres.$SUPABASE_PROJECT_ID" >> "$GITHUB_ENV"
          test "$(gh api repos/Berkay2002/statsforspotify/commits/main --jq .sha)" = "$EXPECTED_SHA"
      - name: Execute reviewed release operation
        run: node .github/scripts/compact-ranking-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ranking-pause-state.json
            ${{ runner.temp }}/ranking-release-result.json
          if-no-files-found: ignore
          retention-days: 7
