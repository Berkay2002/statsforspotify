name: Maintenance production release
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, migrate, collector, resume]
        default: inspect
        required: true
      expected_sha:
        description: Exact reviewed commit to run
        required: true
      backup_run_id:
        description: Successful, locally restored backup workflow run (required for migrate)
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: production-database-maintenance
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPERATION: ${{ inputs.operation }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      GH_TOKEN: ${{ github.token }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGHOST: aws-1-eu-central-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Verify reviewed release and destination
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$SUPABASE_PROJECT_ID" = zpswcygleazebxmpblcx
          echo "PGUSER=postgres.$SUPABASE_PROJECT_ID" >> "$GITHUB_ENV"
      - name: Inspect or execute the selected release step
        run: node .github/scripts/maintenance-release.mjs
